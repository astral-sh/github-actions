name: Rust workspace cache
description: Cache Rust dependencies and workspace artifacts using the active toolchain.

inputs:
  workspace:
    description: Cargo workspace directory.
    default: "."
  target-directory:
    description: Cargo target directory, relative to the workspace.
    default: "target"
  profile:
    description: Build profile directories within the target directory, separated by newlines.
    default: "debug"
  prefix-key:
    description: Cache key prefix; change it to invalidate existing caches.
    default: "v1-rust-workspace"
  key:
    description: Additional cache key.
    default: ""
  add-job-id-key:
    description: Include the job ID in the cache key.
    default: "true"
  cache-workspace-crates:
    description: Cache workspace artifacts as well as dependencies.
    default: "true"
  cache-bin:
    description: Cache binaries installed with Cargo.
    default: "true"
  save-if:
    description: Save the cache after a successful job when this is true.
    default: "true"

outputs:
  cache-hit:
    description: Whether an exact cache match was restored.
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Prepare build input cache
      id: inputs
      uses: $/rust-workspace-cache/inputs/prepare
      with:
        workspace: ${{ inputs.workspace }}

    - name: Prepare Rust cache
      id: configuration
      uses: $/rust-workspace-cache/cache/prepare
      with:
        workspace: ${{ inputs.workspace }}
        target-directory: ${{ inputs.target-directory }}
        profile: ${{ inputs.profile }}
        prefix-key: ${{ inputs.prefix-key }}
        key: ${{ inputs.key }}
        add-job-id-key: ${{ inputs.add-job-id-key }}
        cache-bin: ${{ inputs.cache-bin }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        directory: ${{ steps.inputs.outputs.directory }}

    - name: Restore writable Rust cache
      if: inputs.save-if == 'true'
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.configuration.outputs.paths }}
        key: ${{ steps.configuration.outputs.key }}
        restore-keys: ${{ steps.configuration.outputs.restore-key }}

    - name: Restore read-only Rust cache
      if: inputs.save-if != 'true'
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.configuration.outputs.paths }}
        key: ${{ steps.configuration.outputs.key }}
        restore-keys: ${{ steps.configuration.outputs.restore-key }}

    - name: Restore installed Cargo binaries
      uses: $/rust-workspace-cache/cache
      with:
        configuration: ${{ steps.configuration.outputs.configuration }}
        save: ${{ inputs.save-if == 'true' && steps.cache.outputs.cache-hit != 'true' }}

    - name: Restore build input timestamps
      if: inputs.cache-workspace-crates == 'true'
      uses: $/rust-workspace-cache/inputs
      with:
        workspace: ${{ inputs.workspace }}
        target-directory: ${{ inputs.target-directory }}
        profile: ${{ inputs.profile }}
        directory: ${{ steps.inputs.outputs.directory }}
        save: ${{ inputs.save-if == 'true' && steps.cache.outputs.cache-hit != 'true' }}

    # Post steps run in reverse order, so pruning finishes before the cache is saved.
    - name: Track workspace artifacts
      uses: $/rust-workspace-cache/prune
      with:
        workspace: ${{ inputs.workspace }}
        target-directory: ${{ inputs.target-directory }}
        profile: ${{ inputs.profile }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        enabled: ${{ inputs.save-if == 'true' && steps.cache.outputs.cache-hit != 'true' }}
