name: Test R2 upload action

on:
  pull_request:
    paths:
      - upload-r2/**
      - .github/workflows/test-upload-r2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a release asset
        run: |
          mkdir -p "$RUNNER_TEMP/upload-r2-fixture"
          touch "$RUNNER_TEMP/upload-r2-fixture/release.zip"
      - name: Test dry-run entrypoint
        uses: $/upload-r2
        with:
          account-id: "00000000000000000000000000000000"
          bucket: test-bucket
          prefix: github/project/releases/download/v1
          source-directory: ${{ runner.temp }}/upload-r2-fixture
          include: "*.zip"
          dry-run: "true"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          enable-cache: false
      - name: Test upload planning and retries
        run: uv run --locked --project upload-r2 python -B -m unittest discover -s upload-r2 -v
