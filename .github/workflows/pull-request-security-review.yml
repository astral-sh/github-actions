on:
  workflow_call:
    inputs:
      threat-models:
        description: "Threat model directory in the caller repository"
        type: string
        default: agents/references
      setup-command:
        description: "Bash commands to run at the caller workflow revision before checking out the PR"
        type: string
        default: ""
      runner:
        description: "Linux x86-64 runner for the security review"
        type: string
        default: ubuntu-latest
      helper-runner:
        description: "Linux x86-64 runner for preparing and publishing findings"
        type: string
        default: ubuntu-latest
      uv-version:
        description: "uv version used for repository setup and review scripts"
        type: string
        required: true
      uv-checksum:
        description: "SHA-256 of the Linux x86-64 uv release archive"
        type: string
        required: true
    outputs:
      result:
        description: "The security review result"
        value: ${{ jobs.review.outputs.result }}
      comments:
        description: "The prepared GitHub review comments"
        value: ${{ jobs.prepare.outputs.result }}

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  review:
    name: "security review"
    runs-on: ${{ inputs.runner }}
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.result }}
    steps:
      - name: Checkout review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: security-pr-review
          persist-credentials: false

      - name: Review pull request
        id: review
        uses: ./security-pr-review
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          threat-models: ${{ inputs.threat-models }}
          setup-command: ${{ inputs.setup-command }}
          uv-version: ${{ inputs.uv-version }}
          uv-checksum: ${{ inputs.uv-checksum }}

  prepare:
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ${{ inputs.helper-runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.comments.outputs.result }}
    steps:
      - name: Checkout review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: pull-request-review
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv-version }}
          checksum: ${{ inputs.uv-checksum }}

      - name: "Prepare review findings"
        id: comments
        run: bash pull-request-review/scripts/prepare.sh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULTS: '{"Security": ${{ toJSON(needs.review) }}}'

  report:
    needs: prepare
    if: needs.prepare.outputs.result != '' && fromJSON(needs.prepare.outputs.result).comments[0] != null
    runs-on: ${{ inputs.helper-runner }}
    environment: automations
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # for the credential broker
    steps:
      - name: Checkout review helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: pull-request-review
          persist-credentials: false

      - name: "Get repository token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: "Publish review findings"
        run: bash pull-request-review/scripts/publish.sh
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_RESULT: ${{ needs.prepare.outputs.result }}
