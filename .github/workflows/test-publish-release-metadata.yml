name: Test release metadata publishing

on:
  pull_request:
    paths:
      - publish-release-metadata/**
      - .github/workflows/test-publish-release-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s publish-release-metadata
