name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional YYYY.MM.DD.N; defaults to the version from the merged preparation PR"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.repository == 'astral-sh/github-actions' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Tag rules require this deployment to succeed before publish starts.
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Validate prepared version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --locked scripts/release.py validate "$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field "ref=refs/tags/${VERSION}" \
            --raw-field "sha=${RELEASE_COMMIT}" \
            --silent
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
