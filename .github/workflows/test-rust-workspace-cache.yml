name: Test Rust workspace cache

on:
  pull_request:
    paths:
      - rust-workspace-cache/**
      - .github/workflows/test-rust-workspace-cache.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_BOOTSTRAP: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [1.99.0, 1.100.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - if: runner.os == 'macOS'
        uses: astral-sh/github-actions/demudhra@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889 # 2026.11.16.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal

      - name: Select Rust ${{ matrix.rust }}
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ matrix.rust }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Test pruning and lifecycle
        shell: bash
        run: |
          python -m unittest discover -s rust-workspace-cache/prune -p 'test_*.py'
          python -m unittest discover -s rust-workspace-cache/inputs -p 'test_*.py'
          node --test rust-workspace-cache/prune/lifecycle.test.cjs
          node --test rust-workspace-cache/inputs/lifecycle.test.cjs

      # Register this first so its post step checks the result after the cache post steps.
      - name: Create workspace fixture
        id: fixture
        uses: $/rust-workspace-cache/tests/smoke

      - name: Cache workspace
        uses: $/rust-workspace-cache
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          profile: |
            debug
            profiling
          cache-bin: ${{ runner.os != 'macOS' }}
          prefix-key: test-rust-workspace-cache
          key: ${{ matrix.rust }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seed stale cached artifacts
        run: node rust-workspace-cache/tests/smoke/seed.cjs "${{ steps.fixture.outputs.workspace }}" "${{ steps.fixture.outputs.layout }}"

      - name: Build workspace
        working-directory: ${{ steps.fixture.outputs.workspace }}
        run: |
          cargo build --locked --offline -Z checksum-freshness
          cargo build --locked --offline -Z checksum-freshness --profile profiling
