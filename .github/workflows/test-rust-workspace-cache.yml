name: Test Rust workspace cache key migration
"on":
  workflow_dispatch: null
permissions:
  contents: read
env:
  RUSTC_BOOTSTRAP: "1"
  RUSTUP_TOOLCHAIN: 1.99.0
jobs:
  legacy-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.5
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Create workspace fixture
        id: fixture
        uses: $/rust-workspace-cache/tests/smoke
        with:
          cache-workspace-crates: "true"
          phase: seed
      - name: Cache workspace
        id: cache
        uses: astral-sh/github-actions/rust-workspace-cache@243f4258608cb0f0dace8009ef4c5d8fbd3986c3
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          profile: |
            debug
            profiling
          cache-workspace-crates: "true"
          add-job-id-key: "false"
          prefix-key: test-rust-cache-key-migration
          key: ${{ github.run_id }}-${{ github.run_attempt }}
          save-if: "true"
      - name: Build workspace
        run: node rust-workspace-cache/tests/smoke/build.cjs
        env:
          FIXTURE_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          FIXTURE_MODE: "true"
          FIXTURE_PHASE: seed
    name: Seed a cache without a source key
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.5
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Create workspace fixture
        id: fixture
        uses: $/rust-workspace-cache/tests/smoke
        with:
          cache-workspace-crates: "true"
          phase: restore
      - name: Cache workspace
        id: cache
        uses: astral-sh/github-actions/rust-workspace-cache@7a1c709a167933c8e64f25b527696f043d5ba885
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          profile: |
            debug
            profiling
          cache-workspace-crates: "true"
          add-job-id-key: "false"
          prefix-key: test-rust-cache-key-migration
          key: ${{ github.run_id }}-${{ github.run_attempt }}
          save-if: "true"
      - name: Require a compatible cache fallback
        if: steps.cache.outputs.cache-hit != 'false'
        run: exit 1
      - name: Build workspace
        run: node rust-workspace-cache/tests/smoke/build.cjs
        env:
          FIXTURE_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          FIXTURE_MODE: "true"
          FIXTURE_PHASE: restore
    needs: legacy-seed
    name: Restore the legacy cache and save under a source key
  upgraded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.5
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Create workspace fixture
        id: fixture
        uses: $/rust-workspace-cache/tests/smoke
        with:
          cache-workspace-crates: "true"
          phase: restore
      - name: Cache workspace
        id: cache
        uses: astral-sh/github-actions/rust-workspace-cache@7a1c709a167933c8e64f25b527696f043d5ba885
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          profile: |
            debug
            profiling
          cache-workspace-crates: "true"
          add-job-id-key: "false"
          prefix-key: test-rust-cache-key-migration
          key: ${{ github.run_id }}-${{ github.run_attempt }}
          save-if: "false"
      - name: Require an exact cache hit
        if: steps.cache.outputs.cache-hit != 'true'
        run: exit 1
      - name: Build workspace
        run: node rust-workspace-cache/tests/smoke/build.cjs
        env:
          FIXTURE_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          FIXTURE_MODE: "true"
          FIXTURE_PHASE: restore
    needs: upgrade
    name: Restore the source-keyed cache
