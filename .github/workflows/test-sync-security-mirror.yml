name: Test security mirror sync

on:
  pull_request:
    paths:
      - sync-security-mirror/**
      - .github/workflows/test-sync-security-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s sync-security-mirror
