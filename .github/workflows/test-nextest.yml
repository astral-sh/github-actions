name: Test sharded nextest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test nextest/tests/options.test.mjs

  linux:
    name: nextest on linux
    uses: $/.github/workflows/nextest.yml
    with:
      runs-on: ubuntu-latest
      shards: 2
  macos:
    name: nextest on macos
    uses: $/.github/workflows/nextest.yml
    with:
      runs-on: macos-latest
      shards: 2
  windows:
    name: nextest on windows
    uses: $/.github/workflows/nextest.yml
    with:
      runs-on: windows-latest
      shards: 2
  unsharded:
    name: unsharded nextest on linux
    uses: $/.github/workflows/nextest.yml
    with:
      runs-on: ubuntu-latest
      shards: 1

  coverage:
    name: check test coverage
    needs: [linux, macos, windows, unsharded]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-results-fixture-*
          path: test-results
      - run: python3 nextest/tests/check-coverage.py test-results
