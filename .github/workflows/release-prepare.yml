name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional YYYY.MM.DD.N; defaults to today's UTC date and next available generation"
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    if: github.repository == 'astral-sh/github-actions' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Prepare release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --locked scripts/release.py prepare "$VERSION" >> "$GITHUB_OUTPUT"

      - uses: $/create-release-pr
        with:
          version: ${{ steps.version.outputs.version }}
