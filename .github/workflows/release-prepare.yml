name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version: YYYY.MM.DD, or YYYY.MM.DD.N for a later release that day"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    if: github.repository == 'astral-sh/github-actions' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-prepare-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Prepare release version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py prepare "$VERSION"

      - uses: $/create-release-pr
        with:
          version: ${{ inputs.version }}
