name: Rewrite release changelog
description: Editorialize the newest changelog section and commit it on the prepared release branch.

inputs:
  prompt-file:
    description: Path to the repository's changelog prompt, relative to the workspace root.
    required: true
  openai-api-key:
    description: OpenAI API key for the Codex rewrite.
    required: true

runs:
  using: composite
  steps:
    - name: Prepare changelog rewrite
      id: prepare
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PROMPT_FILE: ${{ github.workspace }}/${{ inputs.prompt-file }}
      run: |
        if [[ ! -f "$PROMPT_FILE" ]]; then
          echo "::error::The changelog prompt file does not exist."
          exit 1
        fi
        if ! git diff --quiet HEAD -- CHANGELOG.md; then
          echo "::error::Commit the generated changelog before running the rewrite."
          exit 1
        fi

        scratch="$(mktemp -d "$RUNNER_TEMP/rewrite-changelog.XXXXXX")"
        printf 'output-file=%s\n' "$scratch/section.md" >> "$GITHUB_OUTPUT"

    - name: Rewrite changelog
      uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        codex-version: "0.169.0"
        model: gpt-5.6-sol
        effort: high
        permission-profile: ":read-only"
        safety-strategy: drop-sudo
        prompt-file: ${{ github.workspace }}/${{ inputs.prompt-file }}
        output-file: ${{ steps.prepare.outputs.output-file }}

    - name: Upload Codex thread
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codex-thread-release-prepare-${{ github.run_id }}-${{ github.run_attempt }}
        path: ~/.codex/sessions
        if-no-files-found: warn

    - name: Apply and commit changelog rewrite
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        CANDIDATE: ${{ steps.prepare.outputs.output-file }}
      run: |
        uv run --locked "$ACTION_PATH/update-latest-changelog-section.py" CHANGELOG.md "$CANDIDATE"
        git diff --check -- CHANGELOG.md
        if git diff --quiet -- CHANGELOG.md; then
          echo "Codex left the generated changelog unchanged."
        else
          git -c core.hooksPath=/dev/null commit --only --message "Rewrite changelog" -- CHANGELOG.md
        fi
