[project]
name = "release-signing-azure-cli"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = ["azure-cli==2.90.0"]

[tool.uv]
package = false
no-build = true
exclude-newer = "P7D"

[tool.uv.exclude-newer-package]
# Remove after certifi 2026.10.19 clears the seven-day cutoff.
certifi = "2026-10-20T02:24:17Z"
