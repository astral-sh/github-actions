name: Delete a key-value entry
description: Delete workflow state from the current GitHub Actions OIDC namespace.

inputs:
  service-url:
    description: HTTPS origin of the key-value service.
    required: true
  audience:
    description: OIDC audience; defaults to the service-url origin.
    default: ""
  scope:
    description: Requested sharing scope (context, workflow, run, run-attempt, job, or repository); the service must authorize it.
    default: context
  key:
    description: Key within the namespace derived from the requested scope and verified OIDC claims.
    required: true

runs:
  using: node24
  main: main.cjs
