# Adapted from https://github.com/curl/curl/blob/f0da5390ad9d380807cc83e600196809df8bb96b/.github/actions/macos-fix-certs/action.yml
name: "demudhra"
description: "Block compromised eMudhra TLS intermediates on macOS runners."

runs:
  using: "composite"
  steps:
    - name: "Patch macOS CA bundles"
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # https://emudhra.we-have-a-problem.com/#macos-curl
        subjects=(
          '/C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3'
          '/C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3'
          '/C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1'
          '/C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services'
        )

        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT

        BLOCKED_SUBJECTS="$(printf '%s\n' "${subjects[@]}")" awk '
          BEGIN {
            count = split(ENVIRON["BLOCKED_SUBJECTS"], names, "\n")
            for (i = 1; i <= count; i++) blocked["=== " names[i]] = 1
          }
          /^(===|###) / { skip = ($0 in blocked) }
          !skip
        ' /etc/ssl/cert.pem > "$tmp"
        grep -q '^-----BEGIN CERTIFICATE-----' "$tmp"
        sudo install -C -m 0644 -o root -g wheel "$tmp" /etc/ssl/cert.pem

        if ! command -v brew >/dev/null; then
          exit 0
        fi
        brew_bundle="$(brew --prefix)/etc/ca-certificates/cert.pem"
        if [[ ! -f "$brew_bundle" ]]; then
          exit 0
        fi

        # Homebrew stores PEM blocks without the macOS subject headings.
        /usr/bin/ruby -ropenssl -e '
          bundle, *blocked = ARGV
          pem_pattern = /^-----BEGIN CERTIFICATE-----\r?\n.*?^-----END CERTIFICATE-----\r?$\n?/m
          print File.binread(bundle).gsub(pem_pattern) { |pem|
            certificate = OpenSSL::X509::Certificate.new(pem)
            blocked.include?(certificate.subject.to_s) ? "" : pem
          }
        ' "$brew_bundle" "${subjects[@]}" > "$tmp"
        grep -q '^-----BEGIN CERTIFICATE-----' "$tmp"
        install -C -m 0644 "$tmp" "$brew_bundle"

    - name: "Deny affected certificates in the macOS System keychain"
      if: runner.os == 'macOS'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # The native trust path can still accept chains after the CA bundles are patched.
        # The pinned TLS certificates match https://support.apple.com/en-us/149555#blocked-certificates
        # and come from https://github.com/galadran/we-have-a-problem.com/blob/8ee244a412a1485b54224f319a16a1e8dfd4cffa/impacted-intermediates.json.
        for cert in "$ACTION_PATH"/certificates/*.pem; do
          sudo -n /usr/bin/security add-trusted-cert -d -r deny -k /Library/Keychains/System.keychain "$cert"
        done
