name: "Build Docker image"
description: "Build an Astral image with standard version checks and tags, and optionally save it in Depot Registry."

inputs:
  name:
    description: "Unique name for this image in the build manifest."
    required: true
  project:
    description: "Depot project ID."
    required: true
  images:
    description: "Newline-separated destination image repositories."
    required: true
  mode:
    description: "The tag mode from `docker-plan`: `release`, `development`, or `dry-run`."
    default: "dry-run"
  version:
    description: "Release version, checked against `project.version` in the checkout's `pyproject.toml` for base-image builds."
    default: ""
  aliases:
    description: "Newline-separated variant aliases from `docker-variant`; empty for the base image."
    default: ""
  file:
    description: "Path to the Dockerfile."
    default: "Dockerfile"
  save:
    description: "Save the image in Depot Registry and upload its record."
    default: "false"
  pull-build-id:
    description: "Optional saved build in this Depot project to authenticate pulls from."
    default: ""

outputs:
  build-id:
    description: "Depot build ID."
    value: ${{ steps.build.outputs.build-id }}
  digest:
    description: "Original multi-platform image digest."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: "Check tag consistency and prepare image tags"
      id: tags
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
        VERSION: ${{ inputs.version }}
        ALIASES: ${{ inputs.aliases }}
      run: python3 "$ACTION_PATH/metadata.py"

    - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

    - name: "Authenticate to Depot Registry"
      if: inputs.pull-build-id != ''
      shell: bash
      env:
        DEPOT_PROJECT_ID: ${{ inputs.project }}
        BUILD_ID: ${{ inputs.pull-build-id }}
      run: |
        token="$(depot pull-token --project "$DEPOT_PROJECT_ID" "$BUILD_ID")"
        echo "::add-mask::$token"
        printf '%s' "$token" | docker login registry.depot.dev --username x-token --password-stdin

    - name: "Extract image metadata"
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      with:
        images: ${{ inputs.images }}
        tags: ${{ steps.tags.outputs.tags }}
        flavor: ${{ steps.tags.outputs.flavor }}

    - name: "Build and save image"
      id: build
      uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
      with:
        project: ${{ inputs.project }}
        context: .
        file: ${{ inputs.file }}
        platforms: linux/amd64,linux/arm64
        save: ${{ inputs.save }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: mode=max
        sbom: true

    - name: "Record image"
      id: record
      if: inputs.save == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        NAME: ${{ inputs.name }}
        BUILD_ID: ${{ steps.build.outputs.build-id }}
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
        ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
      run: bash "$ACTION_PATH/record.sh"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.save == 'true'
      with:
        name: docker-image-${{ inputs.name }}
        path: ${{ steps.record.outputs.path }}
        overwrite: true
